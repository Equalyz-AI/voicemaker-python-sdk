[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myvoicemaker"
version = "0.1.1"
description = "Official Python SDK for the VoiceMaker API"
readme = "README.md"
authors = [{ name = "Collins Edim", email = "collins@equalyz.ai" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]
keywords = [
  "voicemaker", "tts", "asr", "speech", "transcription",
  "nigerian-languages", "yoruba", "igbo", "hausa", "pidgin", "sdk"
]

[project.urls]
Repository = "https://github.com/equalyzai/voicemaker-python-sdk"

[tool.hatch.build.targets.wheel]
packages = ["src/myvoicemaker"]
